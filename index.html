<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lucky Dig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Paytone+One&display=swap" rel="stylesheet">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* System fonts only — no external stylesheets */
:root{color-scheme:dark;box-sizing:border-box}[hidden]{display:none!important}
/* Layout: a lantern-lit mine shaft. A depth rail runs down the left edge and the rock darkens with every layer. */
:root {
  color-scheme: dark;
  --rock: #33241b;
  --rock-deep: #0e0c14;
  --panel: rgba(16, 12, 12, .8);
  --line: rgba(240, 214, 170, .2);
  --ink: #f5ebdc;
  --quiet: #c4b5a1;
  --lantern: #f2b544;
  --danger: #ef6a43;
  --rust: #9c4326;
  --copper: #d48a58;
  --fool: #cdbb55;
  --silver: #cfd8df;
  --gold: #f6c94f;
  --gem: #52d6a8;
  --legend: #ee82d8;
  --display: "Paytone One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Baloo 2", system-ui, sans-serif;
  --mono: var(--body);
  --code: ui-monospace, Menlo, monospace;
  --depth: 0;
}
* { box-sizing: border-box; }
h1, .money, .title-card strong, .descent b, .hud strong {
  background: linear-gradient(180deg, #fff3b8 0%, #f6c94f 42%, #c9811f 68%, #ffe08a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent !important;
  text-shadow: none;
  filter: drop-shadow(0 2px 0 rgba(58, 31, 8, .95)) drop-shadow(0 5px 10px rgba(0, 0, 0, .65));
}
.money.loss {
  background-image: linear-gradient(180deg, #ffd2bd 0%, #ef6a43 55%, #9c2f18 100%);
}
.font-pick { display: grid; gap: 6px; }
.font-pick small { color: var(--quiet); font-weight: 700; }
.font-pick div { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.font-pick button { min-height: 58px; padding: 4px; border-color: var(--line); background: rgba(8, 6, 8, .55); font-size: 18px; font-weight: 400; line-height: 1.1; white-space: nowrap; overflow: hidden; }
.font-pick i { font: 700 12px/1 var(--code); font-style: normal; color: var(--quiet); margin-right: 6px; }
.font-pick button[aria-pressed="true"] { border-color: var(--lantern); color: var(--lantern); }
html, body { height: 100%; }
body {
  background: var(--rock-deep);
  color: var(--ink);
  font: 500 17px/1.4 var(--body);
}
details { padding: 10px 12px; border-radius: 8px; background: rgba(8, 6, 8, .62); text-align: left; text-shadow: none; }
.prompt-meta span { font-weight: 800; }
.clue { text-align: center; background: rgba(8, 6, 8, .5); border-color: var(--line); }
.stakes { text-align: center; }
.stakes div { border-top: 0; padding-top: 0; }
.title-card { border-block: 0; padding-block: 4px; }
@media (max-height: 740px) {
  #stage { height: 112px; }
  .find svg { width: 60px; height: 60px; }
  .card { gap: 10px; }
  .clue { padding: 8px; }
  button { min-height: 48px; padding-block: 9px; }
}
summary { cursor: pointer; font-weight: 800; color: var(--quiet); min-height: 30px; }
details[open] > :not(summary) { margin-top: 10px; }
.icon-strip { display: flex; justify-content: space-between; gap: 4px; }
.icon-strip svg { width: min(13vw, 54px); height: min(13vw, 54px); filter: drop-shadow(0 0 7px currentColor); }
.lead { font-size: 19px; font-weight: 700; }
#cave {
  position: relative;
  min-height: 100%;
  overflow: hidden;
  z-index: 1;
  display: flex;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(28px, calc(env(safe-area-inset-top, 0px) + 24px));
  padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
}
#cave.shake { animation: shake .55s linear; }
@keyframes shake {
  10%, 50%, 90% { transform: translate(-5px, 3px); }
  30%, 70% { transform: translate(5px, -3px); }
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
#stage { height: 150px; pointer-events: none; flex: none; }
#shaft { display: flex; gap: 4px; align-self: center; }
.hud { display: grid; gap: 1px; padding: 6px 10px; min-width: 76px; border-radius: 8px; background: rgba(8, 6, 8, .55); }
.hud small { font: 800 10px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--quiet); }
.hud strong { font: 19px/1.1 var(--display); color: var(--lantern); font-variant-numeric: tabular-nums; }
#bag strong { color: var(--gold); }
button.icon { width: 42px; min-height: 42px; padding: 0; flex: none; display: grid; place-items: center; border-color: var(--line); background: rgba(0, 0, 0, .3); }
button.icon svg { width: 22px; height: 22px; }
.head-right { display: flex; gap: 10px; align-items: flex-start; }
.treasure-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.treasure-row div { display: grid; justify-items: center; gap: 2px; text-align: center; padding: 8px 2px; background: rgba(0, 0, 0, .24); border-radius: 5px; }
.treasure-row svg { width: 44px; height: 44px; filter: drop-shadow(0 0 7px currentColor); }
.treasure-row small { font: 11px/1.2 var(--mono); color: var(--quiet); }
.treasure-row b { font: 500 12px/1.2 var(--mono); }
.descent { display: grid; justify-items: center; gap: 6px; text-align: center; min-height: 170px; align-content: center; }
.descent b { font: clamp(40px, 12vw, 60px)/1 var(--display); color: var(--lantern); }
.pop { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1); }
.icon-strip svg { animation: floaty 2.6s ease-in-out infinite; }
.icon-strip svg:nth-child(2) { animation-delay: -.45s; }
.icon-strip svg:nth-child(3) { animation-delay: -.9s; }
.icon-strip svg:nth-child(4) { animation-delay: -1.35s; }
.icon-strip svg:nth-child(5) { animation-delay: -1.8s; }
.icon-strip svg:nth-child(6) { animation-delay: -2.25s; }
@keyframes floaty { 50% { transform: translateY(-7px) rotate(4deg); } }
.sheen { animation: sheen 3.8s ease-in-out infinite; }
@keyframes sheen { 0%, 35% { transform: translateX(0); } 100% { transform: translateX(900px); } }
.gem-bob { animation: gemBob 2.2s ease-in-out infinite; }
@keyframes gemBob { 50% { transform: translateY(-6px); } }
.twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
.twinkle:nth-of-type(2n) { animation-delay: -.8s; }
.twinkle:nth-of-type(3n) { animation-delay: -1.6s; }
@keyframes twinkle { 0%, 100% { transform: scale(.15); opacity: .2; } 50% { transform: scale(1.15); opacity: 1; } }
.find .pop svg { animation: turn 3.2s ease-in-out infinite; }
@keyframes turn { 0%, 100% { transform: perspective(240px) rotateY(-24deg) translateY(0); } 50% { transform: perspective(240px) rotateY(24deg) translateY(-5px); } }
.money .gold-word, .title-card .gold-word { animation: glint 2.6s ease-in-out infinite; }
@keyframes glint { 50% { filter: brightness(1.22) drop-shadow(0 5px 8px rgba(0, 0, 0, .6)); } }
@keyframes pop { from { transform: scale(.35); opacity: 0; } }
/* Treasure reward: the find grows to centre stage, then flies into the pack. */
.reward { position: fixed; inset: 0; z-index: 30; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 16px; text-align: center; cursor: pointer; background: radial-gradient(circle at 50% 42%, rgba(8, 6, 8, .25), rgba(8, 6, 8, .78) 72%); animation: rewardFade .2s ease-out; -webkit-tap-highlight-color: transparent; }
.reward-rays { position: absolute; left: 50%; top: 42%; width: 150vmax; height: 150vmax; margin: -75vmax 0 0 -75vmax; pointer-events: none; opacity: var(--power); background: repeating-conic-gradient(from 0deg, var(--t) 0 9deg, transparent 9deg 30deg); -webkit-mask-image: radial-gradient(circle, #000 0, transparent 34%); mask-image: radial-gradient(circle, #000 0, transparent 34%); animation: raySpin 7s linear infinite; }
.reward-item { position: relative; width: clamp(150px, 48vmin, 230px); height: clamp(150px, 48vmin, 230px); animation: rewardPop .5s cubic-bezier(.2, 1.7, .4, 1) both; }
.reward-item svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 22px var(--t)) drop-shadow(0 10px 14px rgba(0, 0, 0, .6)); animation: turn 1.8s ease-in-out infinite; }
.reward-text { position: relative; display: grid; justify-items: center; gap: 6px; animation: rewardRise .4s .14s ease-out both; transition: opacity .16s; }
.reward-text b { font: 700 clamp(20px, 6vw, 26px)/1.1 var(--body); color: var(--t); text-shadow: 0 2px 6px rgba(0, 0, 0, .8); }
.reward-text .gold-word { display: block; height: clamp(44px, 13vw, 62px); width: auto; max-width: 88vw; }
.reward.leaving { background: transparent; transition: background .25s; }
.reward.leaving .reward-rays { opacity: 0; transition: opacity .2s; }
.reward.leaving .reward-text { opacity: 0; }
.reward.leaving .reward-item svg { animation: none; }
@keyframes rewardFade { from { opacity: 0; } }
@keyframes rewardPop { from { transform: scale(.15) rotate(-16deg); opacity: 0; } }
@keyframes rewardRise { from { transform: translateY(14px); opacity: 0; } }
@keyframes raySpin { to { transform: rotate(360deg); } }
#bag { position: relative; grid-template-columns: auto 1fr; column-gap: 6px; align-items: center; }
#bag { padding-inline: 8px 10px; min-width: 0; }
#bag strong { grid-column: 2; font-size: 18px; white-space: nowrap; }
#hudLeft { min-width: 64px; }
.pouch { grid-column: 1; width: 26px; height: 26px; display: block; overflow: visible; }
@media (max-width: 430px) { #shaft { gap: 3px; } .notch { width: 8px; height: 8px; } }
#bag.bag-hit .pouch { animation: pouchHit .46s cubic-bezier(.2, 1.6, .4, 1); }
#bag.bag-hit strong { animation: bagFlash .6s ease-out; }
#bag.bag-hit::after { content: ""; position: absolute; left: 21px; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: 3px solid var(--gold); border-radius: 50%; pointer-events: none; animation: bagRing .5s ease-out both; }
@keyframes pouchHit { 0% { transform: scale(1); } 30% { transform: scale(1.45, .8) translateY(3px); } 62% { transform: scale(.88, 1.25) translateY(-3px); } 100% { transform: none; } }
@keyframes bagFlash { 0% { filter: brightness(2.1); } 100% { filter: none; } }
@keyframes bagRing { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.gain { display: flex; align-items: center; justify-content: center; gap: 10px; text-align: left; }
.gain svg { width: 46px; height: 46px; flex: none; display: block; filter: drop-shadow(0 0 8px currentColor); }
.gain strong { display: block; font: 700 20px/1.15 var(--body); }
.gain span { display: block; font-size: 16px; line-height: 1.25; }
.find svg { filter: drop-shadow(0 0 12px currentColor); }
.answers article svg { width: 26px; height: 26px; vertical-align: -7px; margin-right: 4px; }
.notch { width: 11px; height: 11px; transform: rotate(45deg); border-radius: 2px; background: rgba(255, 255, 255, .16); }
.notch.done { background: var(--lantern); }
.notch.here { background: var(--ink); box-shadow: 0 0 8px var(--ink); }
.notch.lost { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
main { width: 100%; max-width: 560px; min-width: 0; min-height: calc(100vh - 28px); min-height: calc(100dvh - 28px); display: flex; flex-direction: column; gap: 8px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; min-height: 52px; margin-top: 6px; }
.brand { font: 20px/1.1 var(--display); letter-spacing: .02em; color: var(--lantern); }
.tag { font: 11px/1.3 var(--mono); color: var(--quiet); margin-top: 4px; }
.bag { text-align: right; }
.bag small { display: block; font: 11px/1.2 var(--mono); color: var(--quiet); letter-spacing: .06em; text-transform: uppercase; }
.bag strong { font: 20px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.card { flex: 1; display: flex; flex-direction: column; gap: 14px; text-align: center; text-shadow: 0 2px 10px rgba(0, 0, 0, .75); }
.card > .choice, .card > #start { margin-top: 10px; }
h1 span { display: block; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.gold-word { display: block; margin-inline: auto; max-width: 100%; height: var(--word, 56px); filter: drop-shadow(0 5px 8px rgba(0, 0, 0, .6)); }
.money, .title-card strong, .descent b { background: none !important; filter: none !important; color: inherit !important; }
.money { --word: clamp(48px, 15vw, 72px); position: relative; }
.title-card strong { --word: clamp(30px, 9vw, 42px); position: relative; }
.descent b { --word: clamp(64px, 19vw, 92px); position: relative; }
h1.logo { background: none; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .7)); line-height: 0; }
.wordmark { width: min(100%, 340px); height: auto; margin-inline: auto; display: block; }
/* Tall phones: grow the logo to fill empty intro space (iPhone 13 ~844) */
@media (min-height: 761px) {
  body.is-intro .wordmark,
  body.is-intro h1.logo svg,
  body.is-intro .logo svg {
    width: min(94vw, 420px) !important;
    height: auto;
  }
  body.is-intro #stage { height: 160px; }
  body.is-intro .icon-strip svg { width: min(12vw, 52px); height: min(12vw, 52px); }
  body.is-intro .card { gap: 10px; justify-content: flex-start; }
}
@media (min-height: 820px) {
  body.is-intro .wordmark,
  body.is-intro h1.logo svg,
  body.is-intro .logo svg { width: min(96vw, 460px) !important; }
  body.is-intro #stage { height: 170px; }
}
h1 { font: clamp(30px, 10.5vw, 54px)/1.08 var(--display); margin: 0; text-wrap: balance; color: var(--gold); }
h2 { font: clamp(26px, 7.5vw, 36px)/1.15 var(--display); margin: 0; text-wrap: balance; }
h3 { font: 700 13px/1.3 var(--mono); margin: 0; color: var(--quiet); letter-spacing: .06em; text-transform: uppercase; }
p { margin: 0; }
.quiet { color: var(--quiet); }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 7px; }
button {
  font: 700 16px/1.2 var(--body); min-height: 52px; padding: 12px 16px; width: 100%;
  border-radius: 5px; cursor: pointer; border: 2px solid var(--lantern); color: var(--ink); background: transparent;
}
button.primary { background: var(--lantern); color: #24170c; }
button.risk { background: var(--rust); border-color: var(--rust); color: var(--ink); }
button.small { min-height: 42px; font-size: 14px; border-color: var(--line); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.prompt-meta { display: flex; justify-content: space-between; gap: 10px; font: 500 13px/1.3 var(--mono); color: var(--quiet); }
#clock { font: 500 22px/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
#clock.low { color: var(--danger); }
.fuse { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.fuse i { display: block; height: 100%; background: var(--lantern); transform-origin: left; }
.fuse i.low { background: var(--danger); }
form { display: flex; gap: 8px; }
input {
  flex: 1; min-width: 0; font: 600 17px/1.2 var(--body); min-height: 52px; padding: 10px 12px;
  border-radius: 5px; border: 2px solid var(--line); background: rgba(0, 0, 0, .35); color: var(--ink);
}
form button { width: auto; flex: none; }
.warn { color: var(--danger); font-weight: 700; }
.ghost { font: 500 12px/1.3 var(--mono); color: var(--lantern); }
.find { display: grid; justify-items: center; gap: 6px; }
.find svg { width: 92px; height: 92px; display: block; }
.tier { font: 500 12px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.money { font: clamp(36px, 11vw, 58px)/1 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.choice { display: grid; gap: 10px; }
.stakes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stakes div { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
.stakes small { display: block; color: var(--quiet); font-size: 12px; }
.stakes b { font: 500 16px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
.clue { display: grid; gap: 3px; padding: 12px; border-radius: 5px; background: rgba(242, 181, 68, .12); border: 1px solid var(--lantern); }
.clue small, .title-card small { color: var(--quiet); font: 12px/1.3 var(--mono); letter-spacing: .04em; }
.clue strong { font-size: 18px; }
.title-card { display: grid; gap: 4px; border-block: 1px solid var(--line); padding-block: 12px; }
.title-card strong { font: clamp(24px, 7vw, 32px)/1.1 var(--display); color: var(--lantern); }
.digging { display: grid; justify-items: center; gap: 10px; text-align: center; min-height: 210px; align-content: center; }
.digging svg { width: 100%; max-width: 240px; height: auto; }
.digging h2 { overflow-wrap: anywhere; }
.crack { fill: none; stroke: var(--lantern); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: crack 1.2s ease-out forwards; }
.crack.c2 { animation-delay: .45s; }
@keyframes crack { to { stroke-dashoffset: 0; } }
.answers { display: grid; gap: 10px; }
.answers article { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 3px; }
.answers b { font-weight: 700; }
pre { margin: 0; padding: 12px; background: rgba(0, 0, 0, .35); border-radius: 5px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 var(--code); }
textarea { width: 100%; height: 120px; font: 12px/1.45 var(--code); color: var(--ink); background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: 5px; padding: 10px; }
#playtestReport textarea.report-full { height: auto; min-height: 220px; max-height: 60vh; overflow: auto; }
.playtest-send { margin: 8px 0 10px; padding: 8px 10px; border: 1px solid var(--lantern); border-radius: 10px; background: rgba(246,201,79,.12); }
.playtest-send .primary { width: 100%; }
.playtest-send .send-status { min-height: 1.2em; margin: 8px 0 0; font: 600 14px/1.35 var(--body); color: var(--gold); text-align: center; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status { min-height: 18px; font: 12px/1.4 var(--mono); color: var(--lantern); }
.rock { position: absolute; top: -40px; width: 22px; height: 18px; background: #5a4537; border-radius: 40% 55% 35% 60%; animation: fall 1s ease-in forwards; pointer-events: none; }
@keyframes fall { to { transform: translateY(110vh) rotate(260deg); } }
@media (prefers-reduced-motion: reduce) {
  #cave.shake, .rock { animation: none; }
  .rock { display: none; }
  #cave { transition: none; }
  .crack { animation: none; stroke-dashoffset: 0; }
  .icon-strip svg, .sheen, .gem-bob, .twinkle, .find .pop svg, .money .gold-word, .title-card .gold-word { animation: none; }
  .reward, .reward-rays, .reward-item, .reward-item svg, .reward-text, #bag.bag-hit .pouch, #bag.bag-hit strong, #bag.bag-hit::after { animation: none; }
}
/* Small phones: both choice buttons must be visible without scrolling. */
@media (max-height: 640px) {
  #cave { padding-block: 6px 8px; }
  main { min-height: 0; gap: 4px; }
  #stage { height: 104px; }
  .card { gap: 6px; }
  .card > .choice, .card > #start { margin-top: 2px; }
  .find { gap: 2px; }
  .find svg { width: 56px; height: 56px; }
  .find h2 { font-size: 20px; }
  .find p { font-size: 15px; line-height: 1.2; }
  .clue { padding: 4px 8px; gap: 0; }
  .clue strong { font-size: 15px; }
  .choice { gap: 6px; }
  button { min-height: 44px; padding-block: 6px; }
}
@media (max-width: 372px) {
  header { gap: 4px; }
  .hud { min-width: 0; padding: 4px 6px; }
  .hud small { font-size: 9px; }
  .hud strong { font-size: 15px; }
  #shaft { gap: 2px; }
  .notch { width: 7px; height: 7px; }
  .pouch { width: 20px; height: 20px; }
  #bag { column-gap: 3px; padding-inline: 5px 6px; }
  #bag strong { font-size: 14px; }
  #hudLeft { min-width: 0; }
  #bag.bag-hit::after { left: 15px; }
  .head-right { gap: 4px; }
  button.icon { width: 34px; min-height: 34px; }
}


.warn-banner {
  display: grid; gap: 4px; padding: 10px 12px; border-radius: 8px;
  background: rgba(239, 106, 67, .22); border: 2px solid var(--danger);
  color: var(--ink); font-weight: 800; text-align: center;
  animation: warnPop .35s cubic-bezier(.2,1.6,.4,1);
  margin-bottom: 10px; position: relative; z-index: 2;
}
form#answerForm { margin-top: 2px; position: relative; z-index: 1; }
.warn-banner small { font: 600 13px/1.3 var(--body); color: var(--quiet); font-weight: 600; }
.confirm-banner {
  display: grid; gap: 8px; padding: 10px 12px; border-radius: 10px;
  background: rgba(242,181,68,.14); border: 1px solid var(--lantern);
  text-align: center; margin: 8px 0;
}
.confirm-banner b { font: 700 16px/1.25 var(--body); color: var(--ink); }
.confirm-banner .confirm-actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.confirm-banner .confirm-actions button { min-height: 44px; width: 100%; }
@media (max-width: 360px) {
  .confirm-banner { padding: 8px 10px; }
  .confirm-banner b { font-size: 15px; }
}

    warned: !!S.warned, layer: S.layer, log: S.log, escapeLayer: S.escapeLayer || null,
    deadline: S.deadline || null,
  };
  saveJSON(LS.result(dateKey), payload);
  saveJSON(LS.lastPlay, dateKey);
  // Cabinet only updates when the run is finished — avoids best-then-common mismatch
  if (S.outcome) {
    if (S.kept) forceCabinetItem(dateKey, DAY_NUM, S.kept, TIERS[S.kept].treasure);
    else if (S.finds.length) {
      const best = [...S.finds].sort((x, y) => TIERS[y.answer.tier].base - TIERS[x.answer.tier].base)[0];
      forceCabinetItem(dateKey, DAY_NUM, best.answer.tier, TIERS[best.answer.tier].treasure);
    }
  }
}
function forceCabinetItem(dateKey, day, tier, treasure) {
  const cab = getCabinet();
  cab[dateKey] = { day, tier, treasure, dateKey };
  saveJSON(LS.cabinet, cab);
}
function loadTodayResult() {
  return loadJSON(LS.result(localDateKey()), null);
}

function clearSkip() {
  if (skipHandler) {
    window.removeEventListener("pointerdown", skipHandler, true);
    window.removeEventListener("keydown", skipHandler, true);
    skipHandler = null;
  }
}
function awaitSkip(ms, { onFrame, allowEnter = true } = {}) {
  return new Promise(resolve => {
    let done = false;
    const start = performance.now();
    const finish = () => {
      if (done) return;
      done = true;
      clearSkip();
      clearInterval(iv);
      resolve();
    };
    skipHandler = e => {
      if (e.type === "keydown" && !(allowEnter && (e.key === "Enter" || e.key === " "))) return;
      e.preventDefault?.();
      finish();
    };
    window.addEventListener("pointerdown", skipHandler, true);
    window.addEventListener("keydown", skipHandler, true);
    const iv = setInterval(() => {
      const t = performance.now() - start;
      onFrame?.(t, ms);
      if (t >= ms) finish();
    }, 40);
  });
}

async function playDigDown(nextLayer) {
  AU.descend();
  document.body.classList.add("animating-fx");
  const stageEl = document.getElementById("stage");
  stageEl.classList.add("anim-tall");
  view.style.visibility = "hidden";
  view.innerHTML = "";
  const from = Math.max(0, S.finds.length * 100);
  const to = (nextLayer + 1) * 100;
  const prevLayer = Math.max(0, nextLayer - 1);
  const fromBiome = BIOMES[prevLayer];
  const toBiome = BIOMES[nextLayer];
  const landY = Math.round(window.innerHeight * 0.62);
  const drop = Math.max(170, Math.round(window.innerHeight * 0.26));
  SCENE.set(prevLayer);
  SCENE.setGround(landY);
  SCENE.setBright(1);
  SCENE.setLook(0);
  SCENE.digging(true); // chisel first
  SCENE.setFall(-drop);
  const fx = showFx(`
    <div class="strata-rush on" id="strata">${[0,1,2,3,4,5,6,7].map(i => `<span style="top:${i*12}%;animation-delay:${i*.05}s;background:linear-gradient(90deg,transparent,${toBiome.crystal}55,rgba(0,0,0,.55),${fromBiome.crystal}44,transparent)"></span>`).join("")}</div>
    <div class="land-dust" id="landDust"></div>
    <div class="fx-copy">
      <b id="depthTick">${from}m</b>
      <p class="quiet" id="biomeTick">${esc(fromBiome.name)} → ${esc(toBiome.name)}</p>
    </div>`);
  fx.classList.add("dig-stage");
  cave.classList.remove("shake");
  void cave.offsetWidth;
  cave.classList.add("shake");
  // phase A: chisel in place (~220ms), then fall while strata scroll
  await awaitSkip(DESCENT_MS, {
    onFrame(t, total) {
      const k = Math.min(1, t / total);
      const depth = Math.round(from + (to - from) * k);
      const el = document.getElementById("depthTick");
      if (el) el.textContent = `${depth}m`;
      document.getElementById("hudValue").textContent = `${depth}m`;
      if (k < 0.12) {
        SCENE.setFall(-drop);
        SCENE.digging(true);
      } else {
        const fk = (k - 0.12) / 0.88;
        SCENE.setFall(-drop + drop * fk);
        SCENE.digging(true);
      }
      if (k > 0.35) SCENE.set(nextLayer);
    }
  });
  SCENE.set(nextLayer);
  SCENE.setFall(0);
  // landing dust puff
  const dust = document.getElementById("landDust");
  if (dust) {
    dust.classList.add("on");
    for (let i = 0; i < 16; i++) {
      const d = document.createElement("i");
      const ang = -Math.PI + (i / 15) * Math.PI;
      d.style.setProperty("--dx", Math.cos(ang) * (40 + Math.random() * 70) + "px");
      d.style.animationDelay = (Math.random() * 0.08) + "s";
      dust.appendChild(d);
    }
  }
  await awaitSkip(200);
  SCENE.digging(false);
  SCENE.clearPose();
  stageEl.classList.remove("anim-tall");
  document.body.classList.remove("animating-fx");
  hideFx();
  cave.classList.remove("shake");
  view.style.visibility = "";
}

async function playCaveIn() {
  const lostAmount = S.bag || S.lost || 0;
  AU.rumble?.();
  AU.collapse();
  document.body.classList.add("animating-fx");
  const stageEl = document.getElementById("stage");
  stageEl.classList.add("anim-tall");
  view.innerHTML = "";
  view.style.visibility = "hidden";
  const landY = Math.round(window.innerHeight * 0.58);
  SCENE.setGround(landY);
  SCENE.setBright(1);
  SCENE.setFall(0);
  SCENE.setLook(0);
  SCENE.digging(false);
  const fx = showFx(`
    <div class="fx-cracks" id="cracks"><svg viewBox="0 0 390 220" preserveAspectRatio="none" aria-hidden="true">
      <path d="M20 10 L70 55 L110 30 L160 90 L200 40 L250 100 L300 35 L360 80"/>
      <path d="M40 5 L90 70 L140 45 L190 110 L240 50 L290 95 L350 40"/>
      <path d="M100 0 L130 40 L180 20 L230 70 L280 25 L330 60"/>
    </svg></div>
    <div class="fx-dust" id="dust"></div>
    <div class="fx-copy">
      <b id="caveMsg"></b>
      <div class="money loss" id="caveMoney" style="display:none">${goldWord(money(lostAmount) || "$0", "red")}</div>
    </div>`);
  fx.classList.add("cave-stage");
  // dust from roof
  const dust = document.getElementById("dust");
  for (let i = 0; i < 48; i++) {
    const d = document.createElement("i");
    d.style.left = Math.random() * 100 + "%";
    d.style.animationDelay = (Math.random() * 1.1) + "s";
    d.style.animationDuration = (1.1 + Math.random() * 0.9) + "s";
    d.style.width = d.style.height = (5 + Math.random() * 12) + "px";
    dust.appendChild(d);
  }
  const boulder = document.createElement("div");
  boulder.className = "boulder";
  boulder.id = "boulder";
  document.body.appendChild(boulder);
  cave.classList.remove("shake-hard");
  void cave.offsetWidth;
  cave.classList.add("shake-hard");
  let phase = 0;
  const flies = [];
  const burstPack = () => {
    bagBox.classList.add("bag-burst");
    bagBox.hidden = false;
    const bagRect = bagBox.getBoundingClientRect();
    const cx = bagRect.left + bagRect.width / 2;
    const cy = Math.max(48, bagRect.top + bagRect.height / 2);
    const tiers = (S.finds || []).map(f => f.answer.tier);
    while (tiers.length < 6) tiers.push("copper");
    tiers.slice(0, 8).forEach((tier, i) => {
      const el = document.createElement("div");
      el.className = "treasure-fly";
      el.innerHTML = icon(tier);
      // Start just below the HUD bag so the flight path never crosses the bag digits
      const startY = Math.max(cy + 28, 72);
      el.style.left = (cx - 22) + "px";
      el.style.top = (startY) + "px";
      el.style.opacity = "1";
      document.body.appendChild(el);
      // Wide downward fan only — keep clear of center countdown (#caveMoney ~ mid-upper)
      const ang = Math.PI * 0.35 + (i / Math.max(1, tiers.length - 1)) * Math.PI * 0.45; // steep down
      const dist = 160 + Math.random() * 120;
      const dx = Math.cos(ang) * dist * (i % 2 === 0 ? 1.15 : -1.15);
      const dy = Math.abs(Math.sin(ang) * dist) + 110 + Math.random() * 60; // strongly downward
      requestAnimationFrame(() => {
        el.style.transition = "transform .7s cubic-bezier(.15,.85,.25,1), opacity .7s";
        el.style.transform = `translate(${dx}px, ${dy}px) rotate(${(i-3.5)*32}deg) scale(1.35)`;
      });
      setTimeout(() => { el.style.opacity = "0"; }, 650);
      flies.push(el);
    });
  };
  await awaitSkip(CAVEIN_MS, {
    onFrame(t) {
      const msg = document.getElementById("caveMsg");
      const moneyEl = document.getElementById("caveMoney");
      const cracks = document.getElementById("cracks");
      // Compressed pre-boulder (~1.0s). Boulder CSS fall is .55s; money starts on land.
      // 0–200: cracks + dust
      if (t > 30 && phase < 1) {
        phase = 1;
        if (cracks) cracks.classList.add("on");
        SCENE.setBright(1);
        SCENE.setLook(0.2);
      }
      // 200–400: look up
      if (t > 200 && phase < 2) {
        phase = 2;
        SCENE.setLook(1.6);
        SCENE.setBright(1);
        if (msg) msg.textContent = "";
      }
      // 400: boulder starts falling (.55s → lands ~950)
      if (t > 400 && phase < 3) {
        phase = 3;
        boulder.classList.add("drop");
      }
      // ~950: boulder lands — bury + rubble
      if (t > 950 && phase < 4) {
        phase = 4;
        SCENE.setLook(0);
        SCENE.collapse();
        SCENE.setBright(0);
        dropRocks(true); // edge-only — keep center clear for the money counter
        if (cracks) cracks.classList.remove("on");
      }
      // ~980: money appears as boulder lands; brief $10k beat then drop (wall-clock hold)
      if (t > 980 && phase < 5) {
        phase = 5;
        window.__caveHoldUntil = performance.now() + 350; // ~0.35s $10,000 beat
        window.__caveCountAt = 0;
        window.__caveBurstAt = performance.now() + 120; // burst shortly after paint
        SCENE.setRainSafe(true);
        SCENE.clearRain();
        [...cave.querySelectorAll(".rock")].forEach(r => r.remove());
        if (dust) [...dust.querySelectorAll("i")].forEach(d => d.remove());
        if (moneyEl) {
          moneyEl.style.display = "";
          moneyEl.classList.remove("cave-money-shown");
          moneyEl.classList.remove("cave-money-in");
          moneyEl.innerHTML = goldWord(money(lostAmount), "red");
          void moneyEl.offsetWidth;
          moneyEl.classList.add("cave-money-in");
        }
        document.getElementById("bagValue").textContent = packMoney(lostAmount);
      }
      if (phase >= 5 && window.__caveBurstAt && performance.now() >= window.__caveBurstAt) {
        window.__caveBurstAt = 0;
        burstPack();
      }
      if (phase >= 5 && moneyEl) {
        const COUNT_MS = 1600; // keep money-drop length; compress only pre-boulder
        const now = performance.now();
        moneyEl.style.display = "";
        if (now < (window.__caveHoldUntil || 0)) {
          document.getElementById("bagValue").textContent = packMoney(lostAmount);
        } else {
          if (!window.__caveCountAt) {
            window.__caveCountAt = now;
            moneyEl.classList.add("cave-money-shown");
            moneyEl.classList.remove("cave-money-in");
            window.__caveLastPaint = -1;
          }
          const k = Math.min(1, Math.max(0, (now - window.__caveCountAt) / COUNT_MS));
          const left = Math.round(lostAmount * (1 - k));
          if (left !== window.__caveLastPaint) {
            window.__caveLastPaint = left;
            moneyEl.innerHTML = goldWord(money(left), "red");
            document.getElementById("bagValue").textContent = packMoney(left);
          }
        }
      }
    }
  });
  // Ensure $0 is painted for a beat before teardown
  {
    const moneyEl = document.getElementById("caveMoney");
    if (moneyEl) {
      moneyEl.style.display = "";
      moneyEl.classList.add("cave-money-shown");
      moneyEl.innerHTML = goldWord("$0", "red");
    }
    document.getElementById("bagValue").textContent = "$0";
    window.__caveHoldUntil = 0;
    window.__caveCountAt = 0;
    window.__caveBurstAt = 0;
  }
  await awaitSkip(280);
  flies.forEach(el => el.remove());
  boulder.remove();
  bagBox.classList.remove("bag-burst");
  document.getElementById("bagValue").textContent = "$0";
  SCENE.setRainSafe(false);
  SCENE.clearRain();
  cave.classList.remove("shake-hard");
  [...cave.querySelectorAll(".rock")].forEach(r => r.remove());
  stageEl.classList.remove("anim-tall");
  document.body.classList.remove("animating-fx");
  SCENE.clearPose();
  hideFx();
  view.style.visibility = "";
  SCENE.collapse();
}

async function beginRun() {
  document.body.classList.remove("is-intro");
  S = fresh();
  S.phase = "digging";
  persistResult(); // lock today as soon as you start
  await playDigDown(0);
  S.layer = 0;
  S.deadline = null;
  question();
}

function descend() {
  clearInterval(timer);
  const target = S.layer;
  playDigDown(target).then(() => { persistResult(); question(); });
}

function question(opts = {}) {
  S.phase = "question";
  const layer = LAYERS[S.layer];
  const ghosted = !!S.ghost;
  if (!opts.resume || !S.deadline) S.deadline = Date.now() + LIMIT * 1000;
  S.lastTick = null;
  warnPauseUntil = 0;
  persistResult();
  shaft();
  SCENE.set(S.layer);
  SCENE.state("idle");
  view.innerHTML = `
    ${ghosted ? '<div class="ghost">Peek only — not scored. Your escape still stands.</div>' : ""}
    <div class="prompt-meta"><span>${(S.layer + 1) * 100}m · ${BIOMES[S.layer].name} · ×${MULT[S.layer]}</span><span id="clock">${LIMIT}</span></div>
    <div class="fuse"><i id="fuse"></i></div>
    <h2>${esc(layer.prompt)}</h2>
    <div class="warn-banner" id="warn" hidden>
      <span>The roof shook…</span>
      <small>We don't recognize that one. One free miss used. Try again.</small>
    </div>
    <div class="confirm-banner" id="confirm" hidden></div>
    <form id="answerForm">
      <input id="answer" aria-label="Your answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Answer in English" maxlength="60">
      <button class="primary" id="digSubmit">Dig</button>
    </form>`;
  document.getElementById("answer").focus();
  document.getElementById("answerForm").onsubmit = submit;
  S.confirm = null;
  clearInterval(timer);
  timer = setInterval(tick, 100);
  tick();
}
function tick() {
  if (Date.now() < warnPauseUntil) {
    // freeze the deadline while warning shows
    return;
  }
  const left = Math.max(0, S.deadline - Date.now()) / 1000;
  const clock = document.getElementById("clock");
  const fuse = document.getElementById("fuse");
  if (!clock) return;
  clock.textContent = Math.ceil(left);
  clock.classList.toggle("low", left <= 6);
  fuse.classList.toggle("low", left <= 6);
  fuse.style.transform = `scaleX(${left / LIMIT})`;
  const whole = Math.ceil(left);
  if (left > 0 && left <= 6 && whole !== S.lastTick) {
    S.lastTick = whole;
    AU.tick(whole <= 3);
  }
  if (left <= 0) {
    clearInterval(timer);
    const typed = document.getElementById("answer")?.value || "";
    const hit = typed.trim() ? matchAnswer(LAYERS[S.layer], typed) : null;
    // Timeout during confirm (or fuzzy-only) = normal timeout — never auto-confirm
    if (hit && hit.answer && !hit.confirm) {
      record("answer", { raw: typed, matched: hit.answer.name, tier: TIERS[hit.answer.tier].name, seconds: LIMIT, auto: true });
      digging(typed, () => found(hit, typed));
      return;
    }
    record("timeout", { seconds: LIMIT, raw: typed.trim() || undefined });
    if (S.peeking || S.ghost) { collapse(typed.trim() || null); return; }
    S.outcome = "buried";
    S.phase = "cavein";
    S.lostAt = S.layer;
    S.lost = S.bag;
    const commonT = [...S.finds].sort((x, y) => TIERS[x.answer.tier].base - TIERS[y.answer.tier].base)[0];
    S.kept = commonT ? commonT.answer.tier : null;
    persistResult();
    collapse(typed.trim() || null);
  }
}

function hideConfirm() {
  const box = document.getElementById("confirm");
  if (box) { box.hidden = true; box.innerHTML = ""; }
  const form = document.getElementById("answerForm");
  if (form) form.style.display = "";
  const dig = document.getElementById("digSubmit");
  if (dig) dig.disabled = false;
  S.confirm = null;
}
function showConfirmPrompt(raw, candidates) {
  S.confirm = { raw, candidates, at: Date.now() };
  const box = document.getElementById("confirm");
  const form = document.getElementById("answerForm");
  if (!box) return;
  const names = candidates.map(c => c.answer.name);
  const label = names.length === 1
    ? `Did you mean ${names[0]}?`
    : `Did you mean ${names.slice(0, -1).join(", ")} or ${names[names.length - 1]}?`;
  // One Yes per candidate if multiple; shared No
  const yesBtns = candidates.map((c, i) =>
    `<button type="button" class="primary" data-confirm-yes="${i}">Yes${candidates.length > 1 ? ": " + esc(c.answer.name) : ""}</button>`
  ).join("");
  box.innerHTML = `<b>${esc(label)}</b><div class="confirm-actions">${yesBtns}<button type="button" class="risk" id="confirmNo">No</button></div>`;
  box.hidden = false;
  if (form) form.style.display = "none";
  box.querySelectorAll("[data-confirm-yes]").forEach(btn => {
    btn.onclick = () => {
      const idx = +btn.getAttribute("data-confirm-yes");
      const pick = (S.confirm && S.confirm.candidates[idx]) || candidates[idx];
      hideConfirm();
      acceptAnswer(raw, { answer: pick.answer, fuzzy: false, confirm: false });
    };
  });
  const no = document.getElementById("confirmNo");
  if (no) no.onclick = () => {
    // Keep answering: no free-miss, timer not paused
    hideConfirm();
    const input = document.getElementById("answer");
    if (input) { input.value = ""; input.focus(); }
    record("confirm_no", { raw });
  };
}
function acceptAnswer(raw, hit) {
  const seconds = +(LIMIT - (S.deadline - Date.now()) / 1000).toFixed(1);
  if (S.finds.length > S.layer || S.phase === "choice" || S.phase === "reveal") {
    const last = S.finds[S.layer] || S.finds[S.finds.length - 1];
    showChoice({ answer: last ? last.answer : hit.answer, fuzzy: false }, last ? last.value : worth(hit.answer.tier, S.layer));
    return;
  }
  clearInterval(timer);
  record("answer", { raw, matched: hit.answer.name, tier: TIERS[hit.answer.tier].name, seconds, confirmed: !!hit.fuzzy });
  commitFind(hit, raw);
  digging(raw, () => afterFindAnim(hit));
}
function submit(e) {
  e.preventDefault();
  const input = document.getElementById("answer");
  const raw = input.value;
  if (!raw.trim()) return;
  if (Date.now() < warnPauseUntil) return;
  if (S.confirm) return; // Yes/No buttons handle confirm; Dig form is hidden
  const seconds = +(LIMIT - (S.deadline - Date.now()) / 1000).toFixed(1);
  const hit = matchAnswer(LAYERS[S.layer], raw);
  if (hit && hit.confirm) {
    showConfirmPrompt(raw, hit.candidates);
    return;
  }
  if (hit && hit.answer) {
    acceptAnswer(raw, hit);
    return;
  }
  record("invalid", { raw, seconds });
  if (!S.warned) {
    S.warned = true;
    persistResult();
    AU.warn();
    cave.classList.remove("shake");
    void cave.offsetWidth;
    cave.classList.add("shake");
    const warn = document.getElementById("warn");
    warn.hidden = false;
    // pause timer for WARN_MS
    const remaining = Math.max(0, S.deadline - Date.now());
    warnPauseUntil = Date.now() + WARN_MS;

  const overlay = document.createElement("div");
  overlay.className = "panel-overlay";
  overlay.innerHTML = `<div class="panel-card" role="dialog" aria-label="Treasure cabinet">
    <header><h2 style="margin:0;font:700 22px var(--display);color:var(--lantern)">Treasure cabinet</h2>
    <button class="small" id="cabClose" style="width:auto">Close</button></header>
    <p class="quiet">Best treasure from each day. A cave-in still leaves you one piece.</p>
    <p class="week-goal">${entries.length}/7 days filled · collect a full week of relics</p>
    <div class="cabinet-grid">${cells}</div>
  </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.addEventListener("click", e => { if (e.target === overlay) close(); });
  overlay.querySelector("#cabClose").onclick = close;
}
function resultFromSave(saved) {
  document.body.classList.remove("is-intro");
  if (saved && saved.status === "done" && saved.outcome) LOCKED_SAVE = JSON.parse(JSON.stringify(saved));
  // If a peek was in progress and the page reloaded, seal it as aborted (one peek/day)
  const peekPend = loadPeekOutcome(saved?.dateKey || localDateKey());
  if (peekPend && peekPend.used && !peekPend.done) {
    savePeekOutcome({ done: "aborted", layer: peekPend.layer, bag: 0, lostAt: null }, saved?.dateKey || localDateKey());
  }
  // Reconstruct minimal S for result display
  S = fresh();
  S.outcome = saved.outcome;
  S.bag = saved.bag;
  S.lost = saved.lost || 0;
  S.lostAt = saved.lostAt;
  S.kept = saved.kept;
  S.streak = saved.streak;
  S.finds = (saved.finds || []).map(f => ({ answer: { name: f.name, tier: f.tier }, value: f.value, raw: f.name }));
  S.escapeLayer = S.finds.length;
  S.log = saved.log || [];
  S.warned = !!saved.warned;
  S.layer = saved.layer || S.finds.length;
  if (saved.status === "playing" || saved.phase === "cavein" || saved.outcome === "buried" && saved.phase === "cavein") {
    S.phase = saved.phase || "question";
    S.warned = !!saved.warned;
    S.layer = saved.layer || 0;
    S.log = saved.log || [];
    S.deadline = saved.deadline || null;
    S.outcome = saved.outcome || null;
    S.lostAt = saved.lostAt;
    S.lost = saved.lost || 0;
    S.kept = saved.kept;
    // cave-in / already buried → finish to result, never back to a fresh timer
    if (S.phase === "cavein" || S.outcome === "buried") {
      S.outcome = "buried";
      S.bag = 0;
      S.phase = "done";
      SCENE.collapse();
      persistResult();
      result(true);
      return;
    }
    // Answer already committed for this layer (choice / reveal / pack anim) → choice, never re-ask
    if ((S.phase === "choice" || S.phase === "reveal" || (S.finds.length > S.layer)) && S.finds.length && !S.outcome) {
      // Clamp finds to one per layer index (sanitize any farmed saves)
      if (S.finds.length > S.layer + 1) {
        S.finds = S.finds.slice(0, S.layer + 1);
        S.bag = S.finds.reduce((n, f) => n + (f.value || 0), 0);
      }
      S.phase = "choice";
      SCENE.set(S.layer);
      shaft();
      bagBox.hidden = false;
      document.getElementById("bagValue").textContent = packMoney(S.bag);
      persistResult();
      const last = S.finds[S.finds.length - 1];
      showChoice({ answer: last.answer, fuzzy: false }, last.value);
      return;
    }
    // Digging to next layer: player didn't err — open next question with a fresh 25s
    if (S.phase === "digging") {
      SCENE.set(S.layer);
      shaft();
      bagBox.hidden = S.finds.length === 0;
      document.getElementById("bagValue").textContent = packMoney(S.bag);
      S.deadline = null;
      question({ resume: false });
      return;
    }
    // question → resume with remaining time (or timeout)
    SCENE.set(S.layer);
    shaft();
    bagBox.hidden = S.finds.length === 0;
    document.getElementById("bagValue").textContent = packMoney(S.bag);
    if (S.deadline && Date.now() >= S.deadline) {
      question({ resume: true });
      clearInterval(timer);
      record("timeout", { seconds: LIMIT, raw: undefined, away: true });
      collapse(null);
      return;
    }
    question({ resume: true });
    return;
  }
  if (saved.status === "playing" && !saved.outcome) {
    // fallback
    SCENE.set(S.layer);
    shaft();
    question({ resume: true });
    return;
  }
  if (saved.outcome === "buried") SCENE.collapse();
  else SCENE.escape();
  result(true);
}
function result(fromSave = false) {
  clearInterval(timer);
  [...cave.querySelectorAll(".rock")].forEach(r => r.remove());
  shaft();
  const won = S.outcome === "escaped";
  const summary = LAYERS.map((layer, i) => {
    const f = S.finds[i];
    const best = layer.answers.filter(x => (x.tier === "legend" || x.tier === "gem") && !x.quiet).slice(0, 3).map(x => x.name).join(", ");
    const yours = f
      ? `${icon(f.answer.tier)}You: ${esc(f.answer.name)} · ${money(f.value)}`
      : (S.lostAt === i ? "You: caved in here" : "You: did not dig here");
    return `<article><b>${(i + 1) * 100}m · ${esc(layer.prompt)}</b><span>${yours}</span><span class="quiet">Rarest: ${esc(best)}</span></article>`;
  }).join("");
  const kept = S.kept ? `<div class="find">${icon(S.kept)}<div><div class="tier" style="color:${TIERS[S.kept].color}">Saved from the rubble</div><p>You kept one ${TIERS[S.kept].treasure}.</p></div></div>` : "";
  const streak = S.streak || getStreak().count || 0;
  const moneyLine = won
    ? goldWord(money(S.bag), "gold")
    : goldWord((S.lost ? "-" + money(S.lost) : "$0"), "red");
  const shareCv = drawShareImage();
  const shareUrl = shareCv.toDataURL("image/png");
  const fire = `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f2b544" d="M12 2s4 4 4 8a4 4 0 1 1-8 0c0-2 1.5-4 2.5-5.5C9 7 8 9 8 11a4 4 0 0 0 8 0c0-3-2-5.5-4-9Z"/><path fill="#ef6a43" d="M12 11c1.2 0 2.2 1 2.2 2.4S13.2 16 12 16s-2.2-1-2.2-2.6S10.8 11 12 11Z"/></svg>`;
  view.innerHTML = `
    <h3>${reachedBottom() ? "Reached the bottom · 700m" : won ? `Escaped at ${S.finds.length * 100}m` : `Buried at ${(S.lostAt + 1) * 100}m`}</h3>
    <div class="money ${won ? "" : "loss"}">${moneyLine}</div>
    <div class="title-card"><small>Your title today</small><strong id="digTitle">${goldWord(digTitle().name)}</strong><p>${digTitle().note}</p></div>
    ${PLAYTEST_MODE ? `<div class="playtest-send" id="playtestSendWrap">
      <button type="button" class="primary" id="sendReport">Copy report for host</button>
      <p class="send-status" id="sendReportStatus" role="status"></p>
    </div>` : ""}
    ${streak ? `<p><span class="streak-pill">${fire} ${streak}-day streak</span></p>` : ""}
    ${whatIf()}
    <div class="countdown">
      <small class="quiet">Next puzzle in</small>
      <b id="nextClock">${formatCountdown(msToMidnight())}</b>
      <span>${esc(tomorrowTeaser())}</span>
    </div>
    <img class="share-preview" id="shareImg" alt="Shareable result" src="${shareUrl}">
    <div class="row3">
      <button class="primary" id="copyShare">Copy result</button>
      <button class="primary" id="shareImgBtn">Share image</button>
    </div>
    <div class="status" id="status" role="status"></div>
    <details>
      <summary>More</summary>
      ${reachedBottom() ? `<div class="find">${VAULT}<div><div class="tier" style="color:var(--gold)">Unlocked</div><h2>The Bottom Vault</h2></div></div>` : ""}
      ${kept}
      ${S.lostAt !== null ? `<p id="missed"><b>You could have said:</b> ${esc(LAYERS[S.lostAt].answers.filter(x => x.tier === "copper" || x.tier === "silver").slice(0, 3).map(x => x.name).join(", "))}</p>` : ""}
      <button class="small" id="openCab2">Treasure cabinet</button>
      <div class="answers">${summary}</div>
      <pre id="share">${esc(shareText())}</pre>
    </details>
    ${SHOW_REPORT ? `<details id="playtestReport"${TEST_MODE ? " open" : ""}>
      <summary>Playtest report</summary>
      <textarea id="report" class="report-full" readonly aria-label="Playtest report">${esc(reportText())}</textarea>
      <div class="row3">
        <button class="small" id="copyReport">Copy report</button>
        <button class="small" id="downloadReport">Download .txt</button>
      </div>
      <p class="quiet">Testers: copy or download this report and send it to me.</p>
    </details>` : ""}
    ${TEST_MODE ? `<div class="test-bar"><button class="small" id="again">Play again (test)</button><button class="small" id="testHome">Test home</button></div>` : `<p class="quiet">Come back tomorrow for Lucky Dig #${DAY_NUM + 1}.</p>`}`;
  document.getElementById("copyShare").onclick = () => copy(shareText(), "Result copied.", "share");
  document.getElementById("shareImgBtn").onclick = () => shareResultImage();
  document.getElementById("openCab2")?.addEventListener("click", () => showCabinet());
  const again = document.getElementById("again");
  if (again) again.onclick = () => { localStorage.removeItem(LS.result(localDateKey())); clearPeekOutcome(); intro(); };
  document.getElementById("testHome")?.addEventListener("click", () => { location.search = "?test=1"; });
  const downloadReportFile = () => {
    const blob = new Blob([reportText()], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `lucky-dig-report-day${DAY_NUM}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  const sizeReportBox = () => {
    const ta = document.getElementById("report");
    if (!ta) return;
    ta.style.height = "auto";
    ta.style.height = Math.min(Math.max(ta.scrollHeight + 8, 220), Math.floor(window.innerHeight * 0.6)) + "px";
  };
  const copyReport = document.getElementById("copyReport");
  if (copyReport) copyReport.onclick = () => copy(reportText(), "Report copied.", "report");
  const dlReport = document.getElementById("downloadReport");
  if (dlReport) dlReport.onclick = () => {
    downloadReportFile();
    const status = document.getElementById("status");
    if (status) status.textContent = "Report downloaded.";
  };
  const reportDetails = document.getElementById("playtestReport");
  if (reportDetails) {
    if (reportDetails.open) sizeReportBox();
    reportDetails.addEventListener("toggle", () => { if (reportDetails.open) sizeReportBox(); });
  }
  const sendReport = document.getElementById("sendReport");
  if (sendReport) sendReport.onclick = async () => {
    const status = document.getElementById("sendReportStatus");
    const text = reportText();
    try {
      await navigator.clipboard.writeText(text);
      if (status) status.textContent = "Copied. Now paste it to me";
    } catch {
      downloadReportFile();
      if (status) status.textContent = "Clipboard unavailable. Downloaded a .txt — send that file to me.";
    }
  };
  const rest = document.getElementById("tryRest");
  if (rest) rest.onclick = () => {
    if (!LOCKED_SAVE) snapshotLock();
    // Fully separate peek sandbox — keep LOCKED_SAVE as the only durable result
    S.peeking = true;
    S.ghost = { bag: 0, finds: [], done: null, lostAt: null };
    S.layer = S.escapeLayer || S.finds.length;
    S.phase = "digging";
    S.deadline = null;
    S.warned = false; // peek gets its own free miss, unscored
    S.outcome = "escaped"; // keep logical escaped for restore; never persist while peeking
    // Consume the one daily peek immediately so refresh mid-peek cannot re-open it
    savePeekOutcome({ used: true, done: null, layer: S.layer, bag: 0, lostAt: null });
    SCENE.state("idle");
    descend();
  };
  clearInterval(window.__ldCountdown);
  window.__ldCountdown = setInterval(() => {
    const el = document.getElementById("nextClock");
    if (el) el.textContent = formatCountdown(msToMidnight());
    // midnight rollover
    const key = localDateKey();
    if (S.dateKey && key !== S.dateKey) {
      clearInterval(window.__ldCountdown);
      DAY_NUM = dayNumber();
      CONTENT_DAY = contentDay(DAY_NUM);
      LAYERS = layersForDay(CONTENT_DAY);
      CLUES = LAYERS.map(l => l.clue || { topic: "Mystery", size: "Many answers" });
      document.body.classList.add("is-intro");
intro();
    }
  }, 1000);
}

async function copy(text, message, id) {
  const status = document.getElementById("status");
  try {
    await navigator.clipboard.writeText(text);
    status.textContent = message;
  } catch {
    const el = document.getElementById(id);
    el?.closest("details")?.setAttribute("open", "");
    if (el?.select) el.select();
    else if (el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    status.textContent = "Copy didn't work here. The text is selected, so copy it by hand.";
  }
}
const soundIcon = on => on
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9Z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9Z" fill="currentColor"/><path d="m17 9 5 6M22 9l-5 6"/></svg>';
const soundBtn = document.getElementById("sound");
const paintSound = () => {
  soundBtn.innerHTML = soundIcon(AU.on);
  soundBtn.setAttribute("aria-pressed", AU.on);
  soundBtn.setAttribute("aria-label", AU.on ? "Sound on" : "Sound off");
};
soundBtn.onclick = () => { AU.init(); AU.toggle(); paintSound(); };
paintSound();
document.getElementById("cabinetBtn").onclick = () => showCabinet();
SCENE.start();

// Boot: if already played today (and not test mode), show result
(function boot() {
  const saved = loadTodayResult();
  if (saved && saved.day === DAY_NUM) {
    S = fresh();
    resultFromSave(saved);
  } else {
    intro();
  }
  // also watch midnight while sitting on intro
  setInterval(() => {
    const n = dayNumber();
    if (n !== DAY_NUM && !document.getElementById("answer") && !document.getElementById("escape")) {
      DAY_NUM = n; CONTENT_DAY = contentDay(DAY_NUM); LAYERS = layersForDay(CONTENT_DAY); CLUES = LAYERS.map(l => l.clue || { topic: "Mystery", size: "Many answers" });
      const s2 = loadTodayResult();
      if (s2 && s2.day === DAY_NUM) resultFromSave(s2); else intro();
    }
  }, 5000);
})();
